experiment_name: conv2d_baseline                                         # 실험 이름 맞게 변경
seed: 42
task: eval                                                               # 학습시 : train / 평가시 : eval
ckpt: "./experiments/subin_an/conv2d_baseline/checkpoints/last.pt"  # 평가시 불러올 checkpoint 파일 경로

paths:
  # 데이터 경로
  tp_file: "./data/1979_2023_MaySep_prec.nc"
  q850_file: "./data/1979_2023_MaySep_q850.nc"
  q1000_file: "./data/1979_2023_MaySep_q1000.nc"
  # 저장 경로
  log_dir: "./experiments/subin_an/conv2d_baseline/logs"
  ckpt_dir: "./experiments/subin_an/conv2d_baseline/checkpoints"
  # 시각화 경로
  eval_dir: "./experiments/subin_an/conv2d_baseline/eval"

model:
  version: "2d"
  name: "geo_unet"
  x1_channels: 1
  x2_channels: 1
  hidden_channels: 24

data:
  label_offsets: [1, 2, 3]    # ← t 기준 t+1,t+2,t+3 예측
  num_workers: 4
  pin_memory: true
  engine: "netcdf4"           # xarray 엔진 이슈 있으면 "h5netcdf"로 바꿔보기

trainer:
  epochs: 3                  
  batch_size: 16
  amp: false
  grad_clip: 0.0
  accumulate_steps: 1
  log_interval: 50            # 로그하는 mini-batch 개수
  val_interval: 1             # validation 하는 epoch 개수
  save_per_metric: true       # 모든 메트릭별로 최고 성능 epoch 저장

monitor:
  key: "val/mse"              # val_mse 기준 최고 성능 epoch 저장
  mode: "min"                 # min : 작을수록 좋은 메트릭 / max : 클수록 좋은 메트릭  

opt:
  name: Adam
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  amsgrad: false

loss:
  name: "mse" 

metrics:
  names: [mse, mae, ms_ssim, csi, fss, rhd, phase, amp, lpips, cpbd]     # CSV/TB에 찍힐 키
  use_mae: true
  use_mse: false
  use_ssim: true
  use_psnr: false
  use_csi: true
  use_fss: true
  use_rhd: true
  use_phase: true
  use_amp: true
  use_lpips: true
  use_cpbd: true
  # 임계값/윈도우
  csi_threshold: 1
  csi_window: 5
  fss_threshold: 1
  fss_window: 5
  rhd_psz: 15
  rhd_bins: 50

normalization:
  tp:
    mean: 0.002479317132383585
    std: 0.005952117739409208
